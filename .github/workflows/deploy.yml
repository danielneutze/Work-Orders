name: Deploy

# Every push to main puts the app online at https://minits-app-c26e1.web.app
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Load deploy key
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$SA" ]; then echo "Missing FIREBASE_SERVICE_ACCOUNT secret. See NOTES.md, Deploying."; exit 1; fi
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"

      - name: Deploy app, database rules and storage rules
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
        run: npx --yes firebase-tools@13 deploy --only hosting,firestore,storage --project minits-app-c26e1 --non-interactive

      - name: Remove deploy key
        if: always()
        run: rm -f "$RUNNER_TEMP/sa.json"
