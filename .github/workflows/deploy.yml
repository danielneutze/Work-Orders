name: Deploy

# Every push to main puts the app online at https://minits-app-c26e1.web.app
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Load deploy key
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$SA" ]; then echo "Missing FIREBASE_SERVICE_ACCOUNT secret. See NOTES.md, Deploying."; exit 1; fi
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"

      - name: Deploy app and database rules
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
        run: |
          set -o pipefail
          npx --yes firebase-tools@13 deploy --only hosting,firestore --project minits-app-c26e1 --non-interactive 2>&1 | tee "$RUNNER_TEMP/deploy.log" || {
            # Surface the error lines as annotations so they show on the run's summary page.
            grep -iE "error|denied|permission|forbidden|required|failed" "$RUNNER_TEMP/deploy.log" | tail -15 | while IFS= read -r line; do echo "::error::${line//%/%25}"; done
            exit 1
          }

      - name: Deploy photo storage rules
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
        run: |
          set -o pipefail
          npx --yes firebase-tools@13 deploy --only storage --project minits-app-c26e1 --non-interactive 2>&1 | tee "$RUNNER_TEMP/storage.log" || {
            grep -iE "error|denied|permission|forbidden|required|failed" "$RUNNER_TEMP/storage.log" | tail -15 | while IFS= read -r line; do echo "::error::${line//%/%25}"; done
            exit 1
          }

      - name: Remove deploy key
        if: always()
        run: rm -f "$RUNNER_TEMP/sa.json"
